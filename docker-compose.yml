# ── 一键启动：MySQL + 后端 + 前端（Nginx） ──
# 使用前必须在根目录 .env 或当前 shell 中设置 MYSQL_ROOT_PASSWORD 与 JWT_SECRET，
# 不允许使用固定默认值（公开的默认密钥等于没有密钥）。
# 启动：docker compose up -d --build
# 演示数据（可选）：docker compose exec server npm run db:seed
services:
  mysql:
    image: mysql:8.0
    container_name: bishe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bishe_dev
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    container_name: bishe-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?请先设置 MYSQL_ROOT_PASSWORD}@mysql:3306/bishe_dev
      JWT_SECRET: ${JWT_SECRET:?请先设置 JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      PORT: 3100
      CORS_ORIGIN: http://localhost:8080
    ports:
      - '3100:3100'
    volumes:
      - uploads:/app/uploads
    # db push 仅用于比赛演示的初始化；生产环境请改用 prisma migrate deploy 管理迁移
    command: sh -c "npx prisma db push && node src/index.js"

  web:
    build: .
    container_name: bishe-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  mysql_data:
  uploads:
