# ── CI 门禁 ──
# 代码合并时自动执行：代码规范检查 → 单元测试 → 构建编译
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run db:generate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      - run: npm --prefix server test

  integration:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bishe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/bishe_test
      JWT_SECRET: ci-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run db:generate
      - run: npm --prefix server run db:push
      - run: npm --prefix server run db:seed
      - run: npm --prefix server run test:concurrency

  e2e:
    needs: [unit, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bishe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/bishe_test
      JWT_SECRET: ci-jwt-secret
      CORS_ORIGIN: http://127.0.0.1:5181,http://localhost:5181
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix server ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm --prefix server run db:generate
      - run: npm --prefix server run db:push
      - run: npm --prefix server run db:seed
      - run: npm run test:e2e

  docker:
    needs: [unit, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password
      JWT_SECRET: ci-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - name: 构建并启动容器
        run: docker compose up -d --build
      - name: 等待后端与前端健康
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3100/api/health >/dev/null; then
              echo "backend ready"
              break
            fi
            sleep 3
          done
          curl -fsS http://localhost:3100/api/health
          curl -fsS -o /dev/null http://localhost:8080
      - name: 输出服务日志
        if: always()
        run: docker compose logs server
      - name: 清理容器
        if: always()
        run: docker compose down -v

  build:
    needs: [unit, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
